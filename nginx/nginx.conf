server {
    listen 80;
    server_name _;

    # GraphQL (queries, mutations y subscriptions por websocket) va a la API.
    location /graphql {
        proxy_pass http://api:4000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:4000/health;
    }

    # Imagenes subidas para la carta (previsualizacion y subida desde el panel de gestion).
    location /uploads {
        proxy_pass http://api:4000/uploads;
        client_max_body_size 6M;
    }

    # Todo lo demas (carta, pedido, cuenta, panel de personal) es la app Nuxt.
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
