services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-laquinta}
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-4000}
      STORE_TIME_ZONE: ${STORE_TIME_ZONE:-America/Bogota}
      MONGO_URI: mongodb://mongo:27017/${MONGO_INITDB_DATABASE:-laquinta}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-un-secreto-largo-y-aleatorio}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_CHANNEL: ${OTP_CHANNEL:-email}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_TAB: ${GOOGLE_SHEETS_TAB:-Pedidos}
      GOOGLE_SHEETS_CANCELLED_TAB: ${GOOGLE_SHEETS_CANCELLED_TAB:-Cancelados}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
    volumes:
      - api-uploads:/app/uploads
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: ./web
      # Etapa de desarrollo: corre `nuxt dev` con hot-reload en vez de servir un build congelado.
      # Para producción, quitar `target` (usa la última etapa del Dockerfile, la que sirve .output).
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_GRAPHQL_HTTP: ${NUXT_PUBLIC_GRAPHQL_HTTP:-http://localhost:4000/graphql}
      NUXT_PUBLIC_GRAPHQL_WS: ${NUXT_PUBLIC_GRAPHQL_WS:-ws://localhost:4000/graphql}
      GRAPHQL_HTTP_INTERNAL: ${GRAPHQL_HTTP_INTERNAL:-http://api:4000/graphql}
      NUXT_PUBLIC_STORE_TIME_ZONE: ${STORE_TIME_ZONE:-America/Bogota}
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-nuxt:/app/.nuxt
    ports:
      - "${WEB_PORT:-3000}:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  mongo-data:
  redis-data:
  api-uploads:
  web-node-modules:
  web-nuxt:
